<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#8AE66A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8AE66A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A6538"/>
      <stop offset="100%" stop-color="#B88A58"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8AE66A"/>
      <stop offset="100%" stop-color="#4A9B3E"/>
    </linearGradient>
  </defs>

  <!-- Тёмный скруглённый фон -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>

  <!-- Мягкое зелёное свечение -->
  <circle cx="32" cy="30" r="22" fill="url(#glow)"/>

  <!-- Ствол -->
  <path d="M30 52 L30 38 C30 36 31 35 32 35 C33 35 34 36 34 38 L34 52 Z" fill="url(#trunk)"/>

  <!-- Крона — 3 слоя для объёма -->
  <ellipse cx="32" cy="26" rx="15" ry="13" fill="#2E5A2E"/>
  <ellipse cx="24" cy="29" rx="9" ry="8" fill="#3E7B3E"/>
  <ellipse cx="40" cy="29" rx="9" ry="8" fill="#3E7B3E"/>
  <ellipse cx="32" cy="22" rx="11" ry="9" fill="url(#crown)"/>

  <!-- Лёгкие блики -->
  <circle cx="28" cy="20" r="1.8" fill="#C8FA9A"/>
  <circle cx="37" cy="26" r="1.4" fill="#C8FA9A" opacity="0.85"/>
  <circle cx="30" cy="29" r="1.1" fill="#C8FA9A" opacity="0.7"/>

  <!-- Земля под стволом — тонкая полоска -->
  <ellipse cx="32" cy="52" rx="9" ry="1.3" fill="#3E7B3E" opacity="0.55"/>
</svg>